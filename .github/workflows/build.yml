name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Codex-Sync-Desktop-Windows
            icon: assets/icon.ico
            icon_data: "assets/icon.ico;assets"
          - os: macos-15-intel
            artifact: Codex-Sync-Desktop-macOS-Intel
            icon: assets/icon.icns
            icon_data: "assets/icon.icns:assets"
          - os: macos-14
            artifact: Codex-Sync-Desktop-macOS-Apple-Silicon
            icon: assets/icon.icns
            icon_data: "assets/icon.icns:assets"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pyinstaller==6.14.2 certifi pillow
      - run: python scripts/generate_icons.py
      - run: pyinstaller --noconfirm --clean --windowed --icon "${{ matrix.icon }}" --add-data "${{ matrix.icon_data }}" --name "Codex Sync Desktop" launch.py
      - name: Smoke test Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist/Codex Sync Desktop/Codex Sync Desktop.exe" --smoke-onboarding'
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          $env:APP_VERSION = $version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows.iss
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "codex-sync-installed"
          $installer = Start-Process -FilePath "dist\Codex-Sync-Desktop-Windows-Setup.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed with exit code $($installer.ExitCode)" }
          $smoke = Start-Process -FilePath "$installDir\Codex Sync Desktop.exe" -ArgumentList @('--smoke-onboarding') -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed app smoke test failed with exit code $($smoke.ExitCode)" }
          $uninstaller = Start-Process -FilePath "$installDir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstaller.ExitCode)" }
      - name: Smoke test macOS app
        if: runner.os == 'macOS'
        run: '"dist/Codex Sync Desktop.app/Contents/MacOS/Codex Sync Desktop" --smoke-onboarding'
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Codex Sync Desktop/*" -DestinationPath "dist/${{ matrix.artifact }}.zip"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Codex Sync Desktop.app" "dist/${{ matrix.artifact }}.zip"
          hdiutil create -volname "Codex Sync Desktop" -srcfolder "dist/Codex Sync Desktop.app" -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.dmg
            dist/Codex-Sync-Desktop-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          find artifacts -type f -exec sha256sum {} \; \
            | sed 's#  artifacts/[^/]*/#  #' \
            | sort > artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
