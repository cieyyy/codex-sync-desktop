[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-sync-desktop"
version = "0.7.2b2"
description = "Lightweight desktop tool for safely synchronizing Codex conversation history"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "cieyyy"}]
dependencies = ["certifi>=2024.2.2"]

[project.gui-scripts]
codex-sync-desktop = "codex_sync_desktop.app:main"

[tool.setuptools.packages.find]
include = ["codex_sync_desktop*"]
